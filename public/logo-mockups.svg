<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <!-- Dusty Lake palette -->
  <rect width="960" height="640" fill="#F5F7FA"/>

  <!-- ===== Panel 1: straight path + marker ===== -->
  <rect x="20" y="20" width="440" height="280" rx="20" fill="#FFFFFF" stroke="#CDD9E8"/>
  <line x1="140" y1="160" x2="340" y2="160" stroke="#1B2D40" stroke-width="3" stroke-linecap="round"/>
  <circle cx="240" cy="160" r="12" fill="#FFFFFF"/>
  <circle cx="240" cy="160" r="7.5" fill="#3D6FA3"/>
  <text x="240" y="262" text-anchor="middle" font-size="14" fill="#7A92AB">A — Marked point on a path</text>

  <!-- ===== Panel 2: GPS route + marker ===== -->
  <rect x="500" y="20" width="440" height="280" rx="20" fill="#FFFFFF" stroke="#CDD9E8"/>
  <path d="M560,190 Q 640,120 720,160 T 880,150" fill="none" stroke="#1B2D40" stroke-width="3" stroke-linecap="round"/>
  <circle cx="720" cy="160" r="12" fill="#FFFFFF"/>
  <circle cx="720" cy="160" r="7.5" fill="#3D6FA3"/>
  <text x="720" y="262" text-anchor="middle" font-size="14" fill="#7A92AB">B — Curved route (uses your polyline feel)</text>

  <!-- ===== Panel 3: wordmark lockup ===== -->
  <rect x="20" y="320" width="440" height="300" rx="20" fill="#FFFFFF" stroke="#CDD9E8"/>
  <line x1="60" y1="430" x2="150" y2="430" stroke="#1B2D40" stroke-width="3" stroke-linecap="round"/>
  <circle cx="105" cy="430" r="11" fill="#FFFFFF"/>
  <circle cx="105" cy="430" r="7" fill="#3D6FA3"/>
  <text x="60" y="500" font-size="40" fill="#1B2D40" font-family="Lora, Georgia, 'Times New Roman', serif">Mile Marker</text>
  <text x="62" y="528" font-size="14" fill="#7A92AB" letter-spacing="0.5">Your private post-run journal</text>
  <text x="240" y="600" text-anchor="middle" font-size="14" fill="#7A92AB">C — Wordmark lockup (Lora serif)</text>

  <!-- ===== Panel 4: app icon / favicon scale ===== -->
  <rect x="500" y="320" width="440" height="300" rx="20" fill="#FFFFFF" stroke="#CDD9E8"/>
  <!-- large tile -->
  <rect x="615" y="380" width="120" height="120" rx="28" fill="#1E4675"/>
  <line x1="645" y1="440" x2="705" y2="440" stroke="#9DB8D6" stroke-width="4" stroke-linecap="round"/>
  <circle cx="675" cy="440" r="9.5" fill="#FFFFFF"/>
  <!-- medium tile -->
  <rect x="760" y="412" width="56" height="56" rx="14" fill="#1E4675"/>
  <line x1="774" y1="440" x2="802" y2="440" stroke="#9DB8D6" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="788" cy="440" r="4.5" fill="#FFFFFF"/>
  <!-- small tile (favicon) -->
  <rect x="836" y="424" width="32" height="32" rx="8" fill="#1E4675"/>
  <line x1="844" y1="440" x2="860" y2="440" stroke="#9DB8D6" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="852" cy="440" r="2.7" fill="#FFFFFF"/>
  <text x="720" y="600" text-anchor="middle" font-size="14" fill="#7A92AB">D — App icon at three sizes</text>
</svg>
