<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <rect width="1200" height="820" fill="#F5F7FA"/>

  <!-- shared shoe+lace glyph, defined once, reused at every scale -->
  <defs>
    <g id="shoemark">
      <!-- upper: single bold continuous stroke, simplified (no cross-hatch laces) -->
      <path d="M18,86
               C18,58 26,34 42,22
               C52,14 60,18 64,30
               C68,42 76,44 86,37
               C104,25 132,24 154,34
               C178,45 196,56 206,66"
            fill="none" stroke="#1B2D40" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- sole -->
      <path d="M10,92
               C10,100 16,104 26,104
               L188,104
               C204,104 214,98 218,88"
            fill="none" stroke="#1B2D40" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- heel closing stroke -->
      <path d="M18,86 L10,92" fill="none" stroke="#1B2D40" stroke-width="9" stroke-linecap="round"/>
      <path d="M206,66 C214,72 218,80 218,88" fill="none" stroke="#1B2D40" stroke-width="9" stroke-linecap="round"/>
      <!-- two lace strands, bold + spaced so they hold at small sizes -->
      <line x1="70" y1="46" x2="96" y2="66" stroke="#1B2D40" stroke-width="9" stroke-linecap="round"/>
      <line x1="90" y1="34" x2="118" y2="56" stroke="#1B2D40" stroke-width="9" stroke-linecap="round"/>
      <!-- trailing lace continues into the wordmark -->
      <path d="M118,56 C150,42 185,50 206,66" fill="none" stroke="#1B2D40" stroke-width="9" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- ===== Panel A: Lora italic "mm", sienna-dark ===== -->
  <rect x="30" y="30" width="540" height="360" rx="20" fill="#FFFFFF" stroke="#CDD9E8"/>
  <g transform="translate(90,150) scale(1.3)">
    <use href="#shoemark" stroke="#1E4675" fill="#1E4675" color="#1E4675"/>
  </g>
  <text x="380" y="270" text-anchor="middle" font-size="120" font-style="italic" font-weight="700"
        font-family="Lora, Georgia, 'Times New Roman', serif" fill="#1E4675">mm</text>
  <text x="300" y="360" text-anchor="middle" font-size="15" fill="#7A92AB"
        font-family="'DM Sans', -apple-system, Helvetica, Arial, sans-serif">A — Lora italic bold "mm" (ties to headline font)</text>

  <!-- ===== Panel B: DM Sans bold "mm", espresso ===== -->
  <rect x="630" y="30" width="540" height="360" rx="20" fill="#FFFFFF" stroke="#CDD9E8"/>
  <g transform="translate(690,150) scale(1.3)">
    <use href="#shoemark"/>
  </g>
  <text x="980" y="265" text-anchor="middle" font-size="110" font-weight="700"
        font-family="'DM Sans', -apple-system, Helvetica, Arial, sans-serif" fill="#1B2D40">mm</text>
  <text x="900" y="360" text-anchor="middle" font-size="15" fill="#7A92AB"
        font-family="'DM Sans', -apple-system, Helvetica, Arial, sans-serif">B — DM Sans bold "mm" (ties to UI font)</text>

  <!-- ===== Panel C: legibility check at icon sizes (using B) ===== -->
  <rect x="30" y="420" width="1140" height="370" rx="20" fill="#FFFFFF" stroke="#CDD9E8"/>
  <text x="60" y="460" font-size="15" fill="#7A92AB"
        font-family="'DM Sans', -apple-system, Helvetica, Arial, sans-serif">C — Icon-only mark at real-world sizes (no wordmark, shoe glyph alone)</text>

  <!-- 128px tile -->
  <rect x="80" y="500" width="180" height="180" rx="36" fill="#1E4675"/>
  <g transform="translate(105,555) scale(0.85)">
    <use href="#shoemark" stroke="#F5F7FA" fill="#F5F7FA"/>
  </g>
  <text x="170" y="710" text-anchor="middle" font-size="13" fill="#7A92AB"
        font-family="'DM Sans', -apple-system, Helvetica, Arial, sans-serif">128px</text>

  <!-- 64px tile -->
  <rect x="330" y="545" width="90" height="90" rx="20" fill="#1E4675"/>
  <g transform="translate(343,572) scale(0.425)">
    <use href="#shoemark" stroke="#F5F7FA" fill="#F5F7FA"/>
  </g>
  <text x="375" y="660" text-anchor="middle" font-size="13" fill="#7A92AB"
        font-family="'DM Sans', -apple-system, Helvetica, Arial, sans-serif">64px</text>

  <!-- 32px tile (favicon) -->
  <rect x="480" y="575" width="46" height="46" rx="11" fill="#1E4675"/>
  <g transform="translate(486,588) scale(0.216)">
    <use href="#shoemark" stroke="#F5F7FA" fill="#F5F7FA"/>
  </g>
  <text x="503" y="645" text-anchor="middle" font-size="13" fill="#7A92AB"
        font-family="'DM Sans', -apple-system, Helvetica, Arial, sans-serif">32px</text>

  <!-- 16px tile (browser tab) -->
  <rect x="570" y="588" width="20" height="20" rx="5" fill="#1E4675"/>
  <g transform="translate(573,594) scale(0.094)">
    <use href="#shoemark" stroke="#F5F7FA" fill="#F5F7FA"/>
  </g>
  <text x="580" y="630" text-anchor="middle" font-size="13" fill="#7A92AB"
        font-family="'DM Sans', -apple-system, Helvetica, Arial, sans-serif">16px</text>

  <!-- full lockup for scale reference -->
  <g transform="translate(750,540) scale(1.1)">
    <use href="#shoemark"/>
  </g>
  <text x="1000" y="640" text-anchor="middle" font-size="72" font-weight="700"
        font-family="'DM Sans', -apple-system, Helvetica, Arial, sans-serif" fill="#1B2D40">mm</text>
  <text x="960" y="700" text-anchor="middle" font-size="13" fill="#7A92AB"
        font-family="'DM Sans', -apple-system, Helvetica, Arial, sans-serif">Full lockup, reference scale</text>
</svg>
